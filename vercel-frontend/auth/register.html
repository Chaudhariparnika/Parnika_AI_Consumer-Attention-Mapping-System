<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Register</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-white via-sky-100 to-sky-300 text-slate-800">

<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">
  <div class="pointer-events-none absolute -left-16 top-10 h-60 w-60 rounded-full bg-sky-300/50 blur-3xl"></div>
  <div class="pointer-events-none absolute right-0 bottom-10 h-72 w-72 rounded-full bg-white/70 blur-3xl"></div>

  <form action="/register" method="POST" id="registerForm" class="relative w-full max-w-2xl rounded-[2rem] border border-white/40 bg-white/70 p-8 shadow-[0_35px_120px_-45px_rgba(14,165,233,0.6)] backdrop-blur-2xl transition duration-500 sm:p-10">

    <div class="mb-8 flex flex-col gap-4 rounded-[1.75rem] border border-sky-200/80 bg-sky-50/70 p-6 shadow-sm shadow-sky-200/40 backdrop-blur-sm">
      <div class="inline-flex h-16 w-16 items-center justify-center rounded-3xl bg-sky-500 text-3xl font-bold text-white shadow-lg shadow-sky-500/30">AC</div>
      <div>
        <h1 class="text-4xl font-semibold tracking-tight text-slate-900 sm:text-5xl">Create your AI access</h1>
        <p class="mt-2 max-w-xl text-sm text-slate-600 sm:text-base">Launch your account for the AI Consumer Attention Mapping System and unlock powerful audience insights.</p>
      </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-sm font-medium uppercase tracking-[0.15em] text-slate-600">Full Name</span>
        <input id="full_name" name="full_name" type="text" placeholder="Jane Doe" class="w-full rounded-3xl border border-slate-200 bg-white/85 px-5 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:bg-white focus:ring-4 focus:ring-sky-100"/>
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-medium uppercase tracking-[0.15em] text-slate-600">Email address</span>
        <input id="email" name="email" type="email" placeholder="jane@example.com" class="w-full rounded-3xl border border-slate-200 bg-white/85 px-5 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:bg-white focus:ring-4 focus:ring-sky-100"/>
      </label>
    </div>

    <label class="mt-4 block">
      <span class="mb-2 block text-sm font-medium uppercase tracking-[0.15em] text-slate-600">Role</span>
      <select id="role" name="role" class="w-full rounded-3xl border border-slate-200 bg-white/85 px-5 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:bg-white focus:ring-4 focus:ring-sky-100">
        <option value="" selected disabled>Select your role</option>
        <option value="admin">Admin</option>
        <option value="store_manager">Store Manager</option>
        <option value="retail_analyst">Retail Analyst</option>
        <option value="marketing_analyst">Marketing Analyst</option>
      </select>
    </label>

    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-sm font-medium uppercase tracking-[0.15em] text-slate-600">Password</span>
        <input id="password" name="password" type="password" placeholder="Enter a secure password" class="w-full rounded-3xl border border-slate-200 bg-white/85 px-5 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:bg-white focus:ring-4 focus:ring-sky-100"/>
        <div class="mt-3 flex items-center gap-2">
          <input id="show_password" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-500" onchange="const p=document.getElementById('password'); const c=document.getElementById('confirm_password'); const type=this.checked ? 'text' : 'password'; p.type = type; c.type = type;"/>
          <label for="show_password" class="text-sm text-slate-600">Show password</label>
        </div>
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-medium uppercase tracking-[0.15em] text-slate-600">Confirm Password</span>
        <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm your password" class="w-full rounded-3xl border border-slate-200 bg-white/85 px-5 py-3 text-slate-900 outline-none transition duration-300 focus:border-sky-400 focus:bg-white focus:ring-4 focus:ring-sky-100"/>
      </label>
    </div>

    <button type="submit" class="mt-7 inline-flex w-full items-center justify-center rounded-3xl bg-sky-600 px-6 py-3 text-base font-semibold text-white shadow-lg shadow-sky-500/30 transition duration-300 hover:-translate-y-0.5 hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-200">Register</button>

    <p class="mt-5 text-center text-sm text-slate-500">By registering, you agree to our <a href="#" class="font-semibold text-sky-600 hover:text-sky-700">Terms of Service</a>.</p>
  </form>
</div>

<script src="/static/js/common/config.js"></script>
<script src="/static/js/common/register.js"></script>

</body>
</html>
