<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reports Dashboard</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100 font-['Manrope'] text-slate-900">
<div class="mx-auto grid w-full max-w-7xl gap-5 px-4 py-8 sm:px-6">
	<!-- reports.html (Part 1): Page layout -->
	<header class="flex flex-col gap-5 border-b border-slate-200 pb-6 lg:flex-row lg:items-end lg:justify-between">
		<div>
			<p class="text-sm font-semibold uppercase tracking-widest text-cyan-700">Operations</p>
			<h1 class="mt-1 text-3xl font-bold">Reports Dashboard</h1>
			<p class="mt-2 text-slate-600">Generate, review, and export analytics reports from your live data.</p>
		</div>
		<div class="flex flex-wrap items-end gap-3">
			<label class="grid gap-1 text-sm font-semibold text-slate-700" for="storeScopeId">Store ID<input id="storeScopeId" class="w-28 rounded border border-slate-300 bg-white px-3 py-2 font-normal outline-none focus:border-cyan-600" type="number" min="1" placeholder="Default"></label>
			<a class="rounded bg-slate-800 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-700" href="/admin/dashboard">Back to Dashboard</a>
		</div>
	</header>

	<section class="overflow-hidden border border-slate-200 bg-white shadow-sm"><div class="overflow-x-auto">
		<table class="w-full text-left text-sm">
			<thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
			<tr>
				<th>Report Name</th>
				<th>Created At</th>
				<th>Actions</th>
			</tr>
			</thead>
			<tbody id="reportTableBody">
			<tr>
				<td colspan="3" class="px-5 py-10 text-center text-slate-500">Loading reports...</td>
			</tr>
			</tbody>
		</table>
	</div></section>

	<!-- reports.html (Part 2): Modals -->
	<div class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/50 p-4" id="viewModal" aria-hidden="true">
		<div class="max-h-[90vh] w-full max-w-6xl overflow-auto bg-white shadow-2xl">
			<div class="sticky top-0 flex items-center justify-between border-b border-slate-200 bg-white px-5 py-4">
				<h3>View Report</h3>
				<button class="h-8 w-8 text-xl text-slate-500 hover:bg-slate-100" data-close="viewModal" aria-label="Close report">&times;</button>
			</div>
			<div class="p-5">
				<div id="viewReportContent"></div>
			</div>
		</div>
	</div>

	<div class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/50 p-4" id="exportModal" aria-hidden="true">
		<div class="w-full max-w-md bg-white shadow-2xl">
			<div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
				<h3>Export Report</h3>
				<button class="h-8 w-8 text-xl text-slate-500 hover:bg-slate-100" data-close="exportModal" aria-label="Close export">&times;</button>
			</div>
			<form id="exportForm" class="grid gap-4 p-5">
				<label class="grid gap-1 text-sm font-semibold" for="exportFormat">Export Format</label>
				<select id="exportFormat" class="rounded border border-slate-300 bg-white px-3 py-2" required>
					<option value="csv">CSV</option>
					<option value="xlsx">Excel (.xlsx)</option>
					<option value="pdf">PDF</option>
				</select>
				<div class="flex justify-end gap-2">
					<button type="button" class="rounded border border-slate-300 px-4 py-2 text-sm font-semibold" data-close="exportModal">Cancel</button>
					<button type="submit" class="rounded bg-cyan-700 px-4 py-2 text-sm font-semibold text-white hover:bg-cyan-800">Export</button>
				</div>
			</form>
		</div>
	</div>

</div>

<script src="/static/js/common/config.js"></script>
<script src="/static/js/admin/reports.js?v=reports-load-4"></script>
</body>
</html>
